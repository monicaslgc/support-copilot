name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  # What a user gets from `pip install`: the built wheel, in a clean environment, with only the declared
  # dependencies. This is the check that would have caught a missing dependency or a missing data file.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[fastapi]"
          cd "$(mktemp -d)"
          /tmp/clean/bin/python -I -c "from support_copilot.main import app; print('server imports')"
          cp "$GITHUB_WORKSPACE/examples/library_usage.py" .
          /tmp/clean/bin/python library_usage.py | tail -1
          /tmp/clean/bin/python -m support_copilot.doctor | tail -2
          echo '[{"subject":"Invoice wrong","body":"I was charged twice, please refund"}]' > tickets.json
          /tmp/clean/bin/python -m support_copilot.evaluate tickets.json --preview 0 | head -1

  # The Dockerfile and compose file: build the image, start it with a key, and ask it for /health.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t support-copilot .
      - name: Start the container and call /health
        run: |
          docker run -d --name copilot -p 8000:8000 -e API_KEY=ci-key support-copilot
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/tickets)" = 401
          docker logs copilot
      - name: Compose refuses to start without an API key
        run: "! docker compose config"
