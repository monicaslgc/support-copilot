[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot"
version = "0.1.0"
description = "Human-in-the-loop AI copilot for support tickets: triage, grounded draft replies, review queue and ticket-system adapters, to embed in your own stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Monica" }]
dependencies = ["pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
claude = ["anthropic>=1.14"]            # model-backed triage and drafts (rules are used without it)
fastapi = ["fastapi>=0.110"]            # the embeddable router: support_copilot.api
server = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.14"]   # the reference server
dev = ["pytest>=8", "httpx>=0.27", "ruff", "mypy", "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.14"]

[project.urls]
Repository = "https://github.com/monicaslgc/support-copilot"

[tool.setuptools.packages.find]
include = ["support_copilot*"]

[tool.setuptools.package-data]
support_copilot = ["kb/*.md", "static/*.html", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so a bare `pytest` (as in CI) can import `app` and `tests`

[tool.mypy]
ignore_missing_imports = true
files = ["support_copilot"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # env vars must be set before app is imported
