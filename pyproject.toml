[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so a bare `pytest` (as in CI) can import `app` and `tests`

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # env vars must be set before app is imported
"docs/src/architecture.py" = ["E501"]   # drawing code taken from the author's diagram kit
