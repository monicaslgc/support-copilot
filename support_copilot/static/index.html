<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue</title>
<link rel="icon" href="data:,">
<style>
/* The fonts ship with the package (support_copilot/static/fonts), so nothing is fetched from a third party. */
@font-face { font-family: "DM Serif Display"; font-weight: 400; font-display: swap; src: url("/static/fonts/dm-serif-display-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("/static/fonts/inter-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url("/static/fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("/static/fonts/inter-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url("/static/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap; src: url("/static/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
:root {
  /* Colour tokens. Rust and ochre are semantic only (warnings); --muted is dark enough for small text (AA). */
  --cream: #F4F1E8; --sage: #A0B3A0; --forest: #153D32; --charcoal: #202A27; --muted-green: #6F8876;
  --bg: var(--cream); --panel: #FAF8F2; --ink: var(--charcoal); --muted: #4C6354; --line: #D6D9D0;
  --accent: var(--forest); --accent-ink: var(--cream); --ai-bg: #E3EAE2; --ai-line: var(--sage);
  --ok: var(--forest); --bad: #9B2F22; --bad-bg: #F6E4DA; --warn: #8A5A12; --warn-bg: #F3E8D2;
  --p1: #9B2F22; --p2: #8A5A12; --p3: var(--forest); --p4: #4C6354; --focus: var(--forest);
  --serif: "DM Serif Display", "Cormorant Garamond", Georgia, serif;
  --sans: Inter, "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A16; --panel: #19231E; --ink: #F4F1E8; --muted: #A9B8AA; --line: #2B3A32;
    --accent: var(--sage); --accent-ink: #12201A; --ai-bg: #1F2B25; --ai-line: #4A5E50;
    --ok: var(--sage); --bad: #F0907F; --bad-bg: #2A1D19; --warn: #E0B060; --warn-bg: #2B2518;
    --p1: #F0907F; --p2: #E0B060; --p3: var(--sage); --p4: #A9B8AA; --focus: var(--sage);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--forest); color: var(--cream); padding: 8px 12px; border-radius: 4px; z-index: 10; }
.skip:focus { left: 8px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
header h1 { font: 400 26px/1.1 var(--serif); letter-spacing: -.01em; margin: 0; color: var(--accent); }
.note { font-size: 13px; color: var(--muted); }
header h1 .note { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; margin-left: 10px; }
.metrics { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-left: auto; }
.metric { display: flex; flex-direction: column; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.metric b { font: 400 22px/1.2 var(--serif); letter-spacing: 0; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 20px; padding: 20px 24px; max-width: 1240px; margin: 0 auto; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 14px 16px 10px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--line); }
.list-head h2 { font: 400 18px var(--serif); margin: 0; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input[type=text], input[type=password], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-height: 36px; }
textarea { width: 100%; min-height: 200px; resize: vertical; background: var(--panel); border-color: color-mix(in srgb, var(--forest) 35%, var(--line)); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }
.item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; padding: 11px 12px; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--sage) 14%, transparent); }
.item[aria-current=true] { background: color-mix(in srgb, var(--sage) 26%, transparent); border-left-color: var(--forest); }
.item .subj { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font: 600 11px/18px var(--mono); border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; margin-right: 6px; }
.P1 { color: var(--p1); } .P2 { color: var(--p2); } .P3 { color: var(--p3); } .P4 { color: var(--p4); }
#clusters { display: grid; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
#clusters:empty { display: none; }
.banner { background: var(--warn-bg); border: 1px solid var(--warn); border-left-width: 4px; border-radius: 3px; padding: 8px 10px; font-size: 13px; }
.banner.hard { background: var(--bad-bg); border-color: var(--bad); }
.banner strong { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.hist li { padding: 2px 0; }
.why { display: inline-block; margin-right: 14px; font-size: 13px; }
#insights { width: calc(100% - 48px); max-width: 1240px; margin: 20px auto; padding: 20px; overflow-x: auto; }
@media (max-width: 760px) { #insights { width: calc(100% - 32px); } }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.detail { padding: 20px; display: grid; gap: 18px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty.error { color: var(--bad); font-weight: 600; }
h3 { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.origin { display: inline-block; font: 600 10px/16px var(--mono); letter-spacing: .08em; border-radius: 2px; padding: 0 5px; margin-left: 8px; vertical-align: 1px; }
.origin.ai { background: var(--sage); color: #12201A; }
.origin.human { background: var(--forest); color: var(--cream); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .origin.human { background: var(--sage); color: #12201A; } }
.ticket-subject { font: 400 22px/1.25 var(--serif); }
.msg { white-space: pre-wrap; background: var(--bg); border-left: 3px solid var(--charcoal); border-radius: 0 3px 3px 0; padding: 10px 12px; margin: 8px 0; }
.sec.ai { background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: 4px; padding: 14px; }
.sec.ai select, .sec.ai textarea { background: var(--panel); }
.sec.human { border: 1.5px solid var(--forest); border-radius: 4px; padding: 14px; display: grid; gap: 14px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sec.human { border-color: var(--sage); } }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field label { display: block; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field div, .field select { margin-top: 3px; }
.rationale { color: var(--muted); font-size: 13px; margin-top: 8px; }
.tag { display: inline-block; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; margin: 0 6px 4px 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.primary, button.danger { border-radius: 3px; padding: 9px 18px; min-height: 40px; font-weight: 600; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent); }
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, black); }
button.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
button.danger:hover:not(:disabled) { background: var(--bad-bg); }
button:disabled { opacity: .5; cursor: default; }
.status { border-radius: 3px; padding: 10px 12px; font-size: 14px; border: 1.5px solid var(--forest); }
.status.approved { background: var(--forest); color: var(--cream); }
.status.rejected { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.status strong { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 2px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status.approved { background: var(--ai-bg); color: var(--ink); border-color: var(--sage); } }
#flash { max-width: 1240px; margin: 12px auto 0; padding: 8px 24px 0; font-size: 14px; font-weight: 600; }
#flash:empty { display: none; }
#flash.ok { color: var(--ok); } #flash.err { color: var(--bad); }
dialog { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
</style>
</head>
<body>
<a class="skip" href="#detail">Skip to ticket</a>
<header>
  <h1>support-copilot <span class="note">review queue</span></h1>
  <button class="link" type="button" id="tab">Insights</button>
  <div class="metrics" id="metrics" aria-live="polite"></div>
</header>
<div id="flash" role="status" aria-live="polite"></div>
<main>
  <section class="panel" aria-label="Tickets">
    <div class="list-head">
      <h2>Tickets</h2>
      <label class="note">Show
        <select id="filter">
          <option value="pending_review">pending review</option>
          <option value="approved">approved</option>
          <option value="rejected">rejected</option>
        </select>
      </label>
    </div>
    <div id="clusters"></div>
    <ul id="list"><li class="empty">Loading tickets…</li></ul>
  </section>
  <section class="panel" id="detail" aria-label="Ticket detail" tabindex="-1"></section>
</main>
<section class="panel" id="insights" hidden aria-label="Insights"></section>
<dialog id="keydlg">
  <form method="dialog">
    <p>This server requires an API key.</p>
    <input type="password" id="keyin" aria-label="API key" autocomplete="off">
    <button class="primary" value="ok">Continue</button>
  </form>
</dialog>

<script>
// Ticket text comes from customers: it is only ever inserted with textContent, never as HTML.
const $ = (id) => document.getElementById(id);
const CATS = ["bug", "billing", "access", "how_to", "feature_request", "other"];
const QUEUE_LIMIT = 500; // the most the API returns; the list says so when it is full instead of hiding the rest
const PRIOS = ["P1", "P2", "P3", "P4"];
let tickets = [], clusters = [], clusterFilter = null, selected = null;

// Feedback lives outside the detail pane so it survives the re-render that follows a decision.
function say(msg, cls = "") { const f = $("flash"); f.className = cls; f.textContent = msg; }

function key() { try { return sessionStorage.getItem("apiKey") || ""; } catch { return ""; } }
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(key() ? { "X-API-Key": key() } : {}) };
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) {
    $("keyin").value = "";
    await new Promise((res) => { $("keydlg").addEventListener("close", res, { once: true }); $("keydlg").showModal(); });
    try { sessionStorage.setItem("apiKey", $("keyin").value); } catch { /* storage unavailable: key lasts for this call only */ }
    return api(path, opts);
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : `HTTP ${r.status}`);
  return body;
}

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  kids.forEach((c) => e.append(c));
  return e;
}
const chip = (p) => el("span", { class: `chip ${p}`, text: p });
const langName = (c) => {
  if (!c || c === "und") return "unclear";
  try { return new Intl.DisplayNames(["en"], { type: "language" }).of(c) || c; } catch { return c; }
};
const pct = (v) => (v === undefined || v === null ? "–" : `${Math.round(v * 100)}%`);

async function loadMetrics() {
  const m = await api("/metrics");
  const box = $("metrics");
  box.replaceChildren();
  const add = (label, value) => box.append(el("div", { class: "metric" }, el("b", { text: value }), el("span", { text: label })));
  add("reviewed", String(m.reviewed));
  if (m.reviewed) {
    add("category agreement", pct(m.category_agreement));
    add("priority agreement", pct(m.priority_agreement));
    add("replies edited", pct(m.reply_edit_rate));
  }
}

function renderClusters() {
  const box = $("clusters");
  box.replaceChildren();
  if ($("filter").value !== "pending_review") return;
  for (const c of clusters.filter((x) => x.kind === "spike")) {
    const active = clusterFilter === c.id;
    const btn = el("button", { class: "link", type: "button", text: active ? "Show all tickets" : `Show these ${c.pending_ids.length}` });
    btn.addEventListener("click", () => { clusterFilter = active ? null : c.id; selected = null; say(""); loadList(); });
    box.append(el("div", { class: "banner" }, el("strong", { text: "Possible incident" }),
      el("div", { text: `${c.size} tickets from ${c.customers} customers about "${c.topic_title || "the same issue"}"` }), btn));
  }
}

async function loadList() {
  const [all, cl] = await Promise.all([api(`/tickets?status=${$("filter").value}&limit=${QUEUE_LIMIT}`), api("/clusters")]);
  clusters = cl;
  if (clusterFilter && !clusters.some((c) => c.id === clusterFilter)) clusterFilter = null;
  tickets = clusterFilter ? all.filter((t) => t.cluster && t.cluster.id === clusterFilter) : all;
  renderClusters();
  const ul = $("list");
  ul.replaceChildren();
  if (all.length >= QUEUE_LIMIT) ul.append(el("li", { class: "empty", text: `Showing the ${QUEUE_LIMIT} most urgent tickets. Review some to see the rest.` }));
  if (!tickets.length) {
    const f = $("filter").value;
    ul.append(el("li", { class: "empty", text: clusterFilter ? "No pending tickets in this incident."
      : f === "pending_review" ? "The queue is clear. Nothing is waiting for review." : `No ${f} tickets yet.` }));
  }
  for (const t of tickets) {
    const tr = t.suggestion.triage;
    const b = el("button", { class: "item", type: "button", "aria-current": String(selected === t.id) },
      el("span", { class: "subj", text: t.subject }),
      el("span", { class: "sub" }, chip(tr.priority), document.createTextNode(`${tr.category} · ${t.customer} `),
        ...(tr.sentiment === "negative" ? [el("span", { class: "tag", text: "upset" })] : []),
        ...(t.cluster ? [el("span", { class: "tag", text: `${t.cluster.kind === "spike" ? "incident" : "related"} ×${t.cluster.size}` })] : []),
        ...(t.duplicate_of ? [el("span", { class: "tag", text: "possible duplicate" })] : [])));
    b.addEventListener("click", () => { selected = t.id; say(""); render(); });
    ul.append(el("li", {}, b));
  }
  if (!tickets.some((t) => t.id === selected)) selected = tickets[0]?.id ?? null;
  render();
}

function render() {
  document.querySelectorAll("#list .item").forEach((b, i) => b.setAttribute("aria-current", String(tickets[i]?.id === selected)));
  const d = $("detail");
  d.replaceChildren();
  const t = tickets.find((x) => x.id === selected);
  if (!t) { d.append(el("div", { class: "empty", text: "Select a ticket to review." })); return; }
  const s = t.suggestion, tr = s.triage, pending = t.status === "pending_review";
  const rv = t.review;

  const prio = el("select", { id: "prio", "aria-label": "Priority" });
  PRIOS.forEach((p) => prio.append(el("option", { value: p, text: p })));
  prio.value = tr.priority;
  const cat = el("select", { id: "cat", "aria-label": "Category" });
  CATS.forEach((c) => cat.append(el("option", { value: c, text: c })));
  cat.value = tr.category;
  if (rv) { prio.value = rv.final_priority; cat.value = rv.final_category; }
  prio.disabled = cat.disabled = !pending;

  const reply = el("textarea", { id: "reply", "aria-label": "Reply to the customer" });
  // Once reviewed, show what was actually approved, not the AI's original draft.
  reply.value = pending || !rv ? s.draft_reply : rv.final_reply;
  reply.readOnly = !pending;

  // Promises in the reply (refunds, guarantees, amounts, deadlines): checked on the server so there is one rulebook.
  let flags = [], armed = false, timer = null, checkSeq = 0;
  const flagsBox = el("div", { class: "note", role: "status" });
  flagsBox.hidden = true;
  const refreshFlags = async () => {
    const seq = ++checkSeq;   // a slow answer for older text must not replace the answer for the current text
    try {
      const r = await api("/check-reply", { method: "POST", body: JSON.stringify({ text: reply.value }) });
      if (seq !== checkSeq) return;
      flags = r.warnings;
      flagsBox.hidden = !flags.length;
      flagsBox.className = flags.some((f) => f.severity === "hard") ? "banner hard" : "note";
      flagsBox.textContent = flags.length ? `Check before sending: this reply ${r.explanation}.` : "";
    } catch { /* the check is a convenience: it must never block a review */ }
  };
  reply.addEventListener("input", () => {
    armed = false;
    if ($("approve")) $("approve").textContent = "Approve and send";
    clearTimeout(timer);
    timer = setTimeout(refreshFlags, 300);
  });
  if (pending) refreshFlags();
  const reviewer = el("input", { type: "text", id: "reviewer", "aria-label": "Your name", placeholder: "Your name" });
  try { reviewer.value = localStorage.getItem("reviewer") || ""; } catch { /* optional convenience */ }

  const REASONS = [["wrong_category", "Wrong category"], ["wrong_priority", "Wrong priority"], ["tone", "Tone"],
    ["missing_info", "Missing info"], ["inaccurate", "Inaccurate"], ["duplicate", "Duplicate"], ["other", "Other"]];
  const why = el("div", {}, el("h3", { text: "If you change or reject it, why? (optional)" }));
  const boxes = REASONS.map(([value, label]) => {
    const cb = el("input", { type: "checkbox", id: `why-${value}`, value });
    why.append(el("label", { class: "why" }, cb, document.createTextNode(` ${label}`)));
    return cb;
  });
  const noteIn = el("input", { type: "text", id: "note", maxlength: "500", placeholder: "Add a note (optional)",
    "aria-label": "Note" });
  noteIn.style.cssText = "display:block;width:100%;margin-top:8px";
  why.append(noteIn);
  const tick = (value, on) => { boxes.find((b) => b.value === value).checked = on; };
  prio.addEventListener("change", () => tick("wrong_priority", prio.value !== tr.priority));
  cat.addEventListener("change", () => tick("wrong_category", cat.value !== tr.category));

  let bulk = null;
  const related = el("div", {});
  const cl = t.cluster;
  if (cl) {
    const spike = cl.kind === "spike", what = cl.topic_title || "the same issue";
    related.append(el("h3", { text: "Related tickets" }), el("div", { class: spike ? "banner" : "note", text: spike
      ? `Possible incident: ${cl.size} tickets from ${cl.customers} customers about "${what}".`
      : `${cl.size} tickets about "${what}" in a short window.` }));
    if (spike && pending && cl.pending > 1) {
      bulk = el("button", { class: "primary", type: "button", id: "bulk", text: `Approve for all ${cl.pending} pending` });
      related.append(el("div", { class: "actions" }, bulk, el("span", { class: "note",
        text: "Unedited: each customer gets their own draft. Edited: the same text goes to all. Priority and category changes apply to all." })));
    }
  }
  if (t.duplicate_of) {
    related.append(el("div", { class: "note", text: `Possible duplicate of ticket #${t.duplicate_of} (same customer and category, close in time).` }));
  }

  const hist = el("div", {});
  if (t.history && t.history.count) {
    hist.append(el("h3", { text: `Earlier tickets from this customer (${t.history.count})` }),
      el("ul", { class: "hist" }, ...t.history.recent.map((h) =>
        el("li", { class: "note", text: `#${h.id} ${h.subject} · ${h.status.replace("_", " ")}` }))));
  }

  const field = (label, node) => el("div", { class: "field" }, el("label", { text: label }), node);
  const arts = s.articles.length
    ? s.articles.map((a) => el("span", { class: "tag", text: a.title }))
    : [el("span", { class: "note", text: "No matching article" })];

  d.append(el("div", { class: "detail" },
    el("div", { class: "sec ticket" }, el("h3", { text: `Ticket #${t.id}${t.system ? ` · ${t.system} ${t.external_id}` : ""}` }),
      el("div", { class: "ticket-subject", text: t.subject }), el("p", { class: "msg", text: t.body }),
      el("div", { class: "note", text: `From ${t.customer}` })),
    el("div", { class: "sec ai" }, el("h3", {}, "AI triage", el("span", { class: "origin ai", text: "AI SUGGESTION" })),
      el("div", { class: "grid" }, field("Priority", prio), field("Category", cat),
        field("Team", el("div", { text: tr.team })),
        field("Confidence", el("div", { text: `${pct(tr.confidence)} · ${tr.source}` })),
        field("Sentiment", el("div", { text: tr.sentiment || "–" })),
        field("Language", el("div", { text: langName(tr.language) }))),
      el("div", { class: "rationale", text: tr.rationale }),
      ...(s.notices || []).map((n) => el("div", { class: "rationale", text: n }))),
    ...(related.children.length ? [related] : []),
    ...(hist.children.length ? [hist] : []),
    el("div", { class: "sec ai" }, el("h3", { text: "Knowledge base" }), el("div", {}, ...arts)),
    el("div", { class: pending ? "sec ai" : "sec" },
      el("h3", {}, pending ? "Draft reply (edit before approving)" : "Reply as sent", ...(pending ? [el("span", { class: "origin ai", text: "AI DRAFT" })] : [])),
      reply, flagsBox),
    ...(pending
      ? [el("div", { class: "sec human" }, el("h3", {}, "Your decision", el("span", { class: "origin human", text: "HUMAN" })), why,
          el("div", { class: "actions" }, reviewer,
            el("button", { class: "primary", type: "button", id: "approve", text: "Approve and send" }),
            el("button", { class: "danger", type: "button", id: "reject", text: "Reject" }),
            el("span", { class: "note", text: "Nothing reaches the customer until you approve." })))]
      : []),
    ...(pending ? [] : [el("div", { class: `status ${t.status}` }, el("strong", { text: t.status === "approved" ? "Approved by a person" : "Rejected by a person" }), document.createTextNode(rv
          ? `${t.status[0].toUpperCase()}${t.status.slice(1)} by ${rv.reviewer} on ${rv.created_at.slice(0, 10)}. `
            + `AI suggested ${tr.priority} / ${tr.category}${rv.final_reply === s.draft_reply ? "" : "; reply was edited"}.`
            + (rv.reasons && rv.reasons.length ? ` Reasons: ${rv.reasons.map((x) => x.replace("_", " ")).join(", ")}.` : "")
            + (rv.note ? ` Note: ${rv.note}` : "")
          : `This ticket was ${t.status}.`))])));

  if (pending) {
    const send = async (url, action, done, extra = {}) => {
      const name = reviewer.value.trim();
      if (!name) { say("Enter your name first.", "err"); reviewer.focus(); return; }
      try { localStorage.setItem("reviewer", name); } catch { /* optional convenience */ }
      if (action === "approved" && !reply.value.trim()) { say("The reply is empty. Write one, or reject the ticket.", "err"); reply.focus(); return; }
      if (action === "approved") { clearTimeout(timer); await refreshFlags(); }   // the text as it is right now
      if (action === "approved" && flags.some((f) => f.severity === "hard") && !armed) {
        armed = true;
        $("approve").textContent = "Send anyway";
        say("This reply makes a promise a person has to stand behind. Click Send anyway to confirm.", "err");
        return;
      }
      const body = { action, reviewer: name, ...extra };
      if (reply.value !== s.draft_reply && reply.value.trim()) body.edited_reply = reply.value;
      if (prio.value !== tr.priority) body.final_priority = prio.value;
      if (cat.value !== tr.category) body.final_category = cat.value;
      const reasons = boxes.filter((b) => b.checked).map((b) => b.value);
      if (reasons.length) body.reasons = reasons;
      if (noteIn.value.trim()) body.note = noteIn.value.trim();
      const buttons = [$("approve"), $("reject"), bulk].filter(Boolean);
      buttons.forEach((b) => { b.disabled = true; });
      try {
        const res = await api(url, { method: "POST", body: JSON.stringify(body) });
        say(done(res), res.sync === "error" ? "err" : "ok");
        await Promise.all([loadMetrics(), loadList()]);
      } catch (e) {
        say(e.message, "err");
        buttons.forEach((b) => { b.disabled = false; });
      }
    };
    const synced = (res) => (res.sync ? ` (${res.sync.replace("_", " ")} in the ticket system)` : "");
    $("approve").addEventListener("click", () => send(`/tickets/${t.id}/review`, "approved", (res) => `Ticket #${t.id} approved${synced(res)}.`));
    $("reject").addEventListener("click", () => send(`/tickets/${t.id}/review`, "rejected", (res) => `Ticket #${t.id} rejected${synced(res)}.`));
    if (bulk) {
      bulk.addEventListener("click", () => send(`/clusters/${cl.id}/review`, "approved",
        (res) => `${res.reviewed.length} tickets approved${res.skipped.length ? `, ${res.skipped.length} skipped` : ""}`
          + `${res.left_pending.length ? `, ${res.left_pending.length} newer left for you to read` : ""}.`,
        { ticket_ids: cl.pending_ids }));
    }
  }
}

async function loadInsights() {
  const m = await api("/metrics/breakdown");
  const box = $("insights");
  box.replaceChildren(el("h3", { text: "How the AI is doing, per category" }));
  if (!m.reviewed) { box.append(el("div", { class: "empty", text: "No reviews yet." })); return; }
  const th = (t) => el("th", { text: t });
  const td = (t) => el("td", { text: String(t) });
  const head = ["Category", "Reviewed", "Clean", "Clean, lower bound", "Replies edited", "Rejected", "Automation candidate"];
  const rows = m.by_category.map((c) => el("tr", {}, td(c.category), td(c.reviewed), td(pct(c.clean_rate)),
    td(pct(c.clean_rate_lower_bound)), td(pct(c.reply_edit_rate)), td(pct(c.rejection_rate)),
    td(c.automation_candidate ? "yes" : "not yet")));
  box.append(el("table", {}, el("thead", {}, el("tr", {}, ...head.map(th))), el("tbody", {}, ...rows)),
    el("p", { class: "note", text: `Clean means approved with the category, priority and reply untouched. A category shows "yes" after `
      + `${m.automation.min_reviews}+ reviews with a lower bound of ${pct(m.automation.min_lower_bound)} or more: a few perfect reviews are not enough. `
      + m.automation.note }));
  const entries = Object.entries(m.reasons);
  box.append(el("h3", { text: `Why people corrected it (${pct(m.reason_coverage)} of ${m.overrides} corrections explained)` }),
    el("div", {}, ...(entries.length ? entries.map(([k, v]) => el("span", { class: "tag", text: `${k.replace("_", " ")} ×${v}` }))
      : [el("span", { class: "note", text: "No reasons recorded yet." })])));
}
$("tab").addEventListener("click", async () => {
  const on = $("insights").hidden;
  $("insights").hidden = !on;
  document.querySelector("main").hidden = on;
  $("tab").textContent = on ? "Back to queue" : "Insights";
  if (on) { try { await loadInsights(); } catch (e) { $("insights").replaceChildren(el("div", { class: "empty", text: e.message })); } }
});

$("filter").addEventListener("change", () => { selected = null; clusterFilter = null; say(""); loadList(); });
Promise.all([loadMetrics(), loadList()]).catch((e) => { $("detail").replaceChildren(el("div", { class: "empty error", role: "alert", text: e.message }));
  $("list").replaceChildren(el("li", { class: "empty", text: "Could not load tickets." })); });
</script>
</body>
