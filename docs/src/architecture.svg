<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Nothing reaches the customer until a person approves"><title>Nothing reaches the customer until a person approves</title><defs><style>.title{font:400 46px 'DM Serif Display', Georgia, serif;fill:#153D32;letter-spacing:-.5px}.eyebrow{font:500 12.5px 'JetBrains Mono', monospace;fill:#4C6354;letter-spacing:2.4px;text-transform:uppercase}.sub{font:400 17px Inter, 'DM Sans', sans-serif;fill:#4C6354}.label{font:600 15.5px Inter, 'DM Sans', sans-serif;fill:#153D32}.chip{font:500 15px Inter, 'DM Sans', sans-serif;fill:#153D32}.tag{font:500 10.5px 'JetBrains Mono', monospace;fill:#4C6354;letter-spacing:1.6px;text-transform:uppercase}.note{font:400 13px Inter, 'DM Sans', sans-serif;fill:#202A27}.lane{font:500 11.5px 'JetBrains Mono', monospace;fill:#153D32;letter-spacing:2.2px;text-transform:uppercase}</style><marker id="ah" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#153D32" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="900" fill="#F4F1E8"/><path d="M-40 -10 L520 -10 C470 120 330 190 160 170 C60 158 -10 110 -40 60 Z" fill="#A0B3A0" opacity=".20"/><path d="M1040 910 L1640 910 L1640 670 C1500 730 1330 840 1180 830 C1110 826 1070 860 1040 910 Z" fill="#A0B3A0" opacity=".22"/><path d="M-30 760 C80 670 150 810 90 920 L-30 920 Z" fill="#A0B3A0" opacity=".12"/><text x="80" y="62" class="eyebrow">support-copilot · architecture</text><text x="80" y="118" class="title">Nothing reaches the customer until a person approves</text><text x="80" y="152" class="sub">Which steps are AI, which are plain rules, and where the human decision sits.</text><g><path d="M1245 358.0 C1245 325.0 1180 325.0 1180 292.0" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="1245" cy="358.0" r="3.6" fill="#153D32"/></g><g><path d="M1287.0 400 C1356.5 400 1356.5 400 1426.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="1287.0" cy="400" r="3.6" fill="#153D32"/></g><g><path d="M1064.0 400 C1133.5 400 1133.5 400 1203.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="1064.0" cy="400" r="3.6" fill="#153D32"/></g><g><path d="M841.0 400 C910.5 400 910.5 400 980.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="841.0" cy="400" r="3.6" fill="#153D32"/></g><g><path d="M618.0 400 C687.5 400 687.5 400 757.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="618.0" cy="400" r="3.6" fill="#153D32"/></g><g><path d="M395.0 400 C464.5 400 464.5 400 534.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="395.0" cy="400" r="3.6" fill="#153D32"/></g><g><path d="M172.0 400 C241.5 400 241.5 400 311.0 400" fill="none" stroke="#153D32" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="172.0" cy="400" r="3.6" fill="#153D32"/></g><g><rect x="88.0" y="358.0" width="84" height="84" rx="16.8" fill="#F4F1E8" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(108.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-7h12l2 7v5H4zM4 13h5l1 2h4l1-2h5"/></g><text x="130" y="466.0" text-anchor="middle" class="label">Ticket arrives</text><text x="130" y="485.0" text-anchor="middle" class="tag">zammad or zendesk</text><text x="130" y="506.0" text-anchor="middle" class="note">signed, idempotent</text><text x="130" y="523.0" text-anchor="middle" class="note">webhook</text></g><g><rect x="311.0" y="358.0" width="84" height="84" rx="16.8" fill="#DDE5DC" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(331.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2.2 2.2L15 10.5"/></g><text x="353" y="466.0" text-anchor="middle" class="label">Mask private data</text><text x="353" y="485.0" text-anchor="middle" class="tag">plain rules</text><text x="353" y="506.0" text-anchor="middle" class="note">emails, cards, IBANs,</text><text x="353" y="523.0" text-anchor="middle" class="note">phones, passwords</text></g><g><rect x="534.0" y="358.0" width="84" height="84" rx="16.8" fill="#DDE5DC" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(554.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11.2 16 7M8 12.8 16 17"/></g><text x="576" y="466.0" text-anchor="middle" class="label">Triage</text><text x="576" y="485.0" text-anchor="middle" class="tag">claude or rules</text><text x="576" y="506.0" text-anchor="middle" class="note">category, P1 to P4,</text><text x="576" y="523.0" text-anchor="middle" class="note">sentiment, language</text></g><g><rect x="757.0" y="358.0" width="84" height="84" rx="16.8" fill="#DDE5DC" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(777.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></g><text x="799" y="466.0" text-anchor="middle" class="label">Draft reply</text><text x="799" y="485.0" text-anchor="middle" class="tag">claude or template</text><text x="799" y="506.0" text-anchor="middle" class="note">help article, in the</text><text x="799" y="523.0" text-anchor="middle" class="note">customer's language</text></g><g><rect x="980.0" y="358.0" width="84" height="84" rx="16.8" fill="#DDE5DC" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(1000.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16 9.5"/></g><text x="1022" y="466.0" text-anchor="middle" class="label">Check and link</text><text x="1022" y="485.0" text-anchor="middle" class="tag">plain rules</text><text x="1022" y="506.0" text-anchor="middle" class="note">promises flagged,</text><text x="1022" y="523.0" text-anchor="middle" class="note">incidents grouped</text></g><g><rect x="1203.0" y="358.0" width="84" height="84" rx="16.8" fill="#153D32" stroke="#153D32" stroke-width="1.5"/><g transform="translate(1223.16 378.16) scale(1.82)" fill="none" stroke="#F4F1E8" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/></g><text x="1245" y="466.0" text-anchor="middle" class="label">Human approval</text><text x="1245" y="485.0" text-anchor="middle" class="tag">approve or reject</text><text x="1245" y="506.0" text-anchor="middle" class="note">edit first; one click</text><text x="1245" y="523.0" text-anchor="middle" class="note">for a whole incident</text></g><g><rect x="1426.0" y="358.0" width="84" height="84" rx="16.8" fill="#F4F1E8" stroke="#A0B3A0" stroke-width="1.5"/><g transform="translate(1446.16 378.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></g><text x="1468" y="466.0" text-anchor="middle" class="label">Customer</text><text x="1468" y="485.0" text-anchor="middle" class="tag">after approval only</text><text x="1468" y="506.0" text-anchor="middle" class="note">public reply; the AI's</text><text x="1468" y="523.0" text-anchor="middle" class="note">notes stay internal</text></g><g><rect x="1138.0" y="208.0" width="84" height="84" rx="16.8" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.5" stroke-dasharray="4 4"/><g transform="translate(1158.16 228.16) scale(1.82)" fill="none" stroke="#153D32" stroke-width="0.51" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 10h16M10 5v14"/></g><text x="1240.0" y="242" class="label">Per-category metrics</text><text x="1240.0" y="261" class="tag">informational</text><text x="1240.0" y="282" class="note">clean rate and a</text><text x="1240.0" y="299" class="note">confidence bound</text></g><text x="1357" y="348" text-anchor="middle" class="tag">approved</text><rect x="80" y="700" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.3"/><text x="102" y="735" text-anchor="start" class="label">No key needed</text><text x="102" y="761" text-anchor="start" class="note">Without an API key every AI step falls</text><text x="102" y="780" text-anchor="start" class="note">back to plain rules, so it runs offline.</text><rect x="450" y="700" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.3"/><text x="472" y="735" text-anchor="start" class="label">Failure is visible</text><text x="472" y="761" text-anchor="start" class="note">A refusal, cut-off or outage falls back</text><text x="472" y="780" text-anchor="start" class="note">to rules, and the triage says so.</text><rect x="820" y="700" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.3"/><text x="842" y="735" text-anchor="start" class="label">Known gaps</text><text x="842" y="761" text-anchor="start" class="note">Names and addresses are not masked, and</text><text x="842" y="780" text-anchor="start" class="note">an oddly worded promise gets through.</text><rect x="1190" y="700" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.3"/><text x="1212" y="735" text-anchor="start" class="label">Not verified</text><text x="1212" y="761" text-anchor="start" class="note">Zammad, Zendesk and the live Claude API</text><text x="1212" y="780" text-anchor="start" class="note">are only tested against fakes.</text><rect x="80" y="859" width="22" height="22" rx="5" fill="#DDE5DC" stroke="#A0B3A0" stroke-width="1.3"/><text x="112" y="874" class="tag">step</text><rect x="164.8" y="859" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#D6D9D0" stroke-width="1.3" stroke-dasharray="3 3"/><text x="196.8" y="874" class="tag">metrics</text><rect x="274.2" y="859" width="22" height="22" rx="5" fill="#153D32" stroke="#153D32" stroke-width="1.3"/><text x="306.2" y="874" class="tag">human step</text><rect x="408.2" y="859" width="22" height="22" rx="5" fill="#F4F1E8" stroke="#A0B3A0" stroke-width="1.3"/><text x="440.2" y="874" class="tag">outside system</text><text x="1520" y="870" text-anchor="end" class="tag">Prototype · synthetic data · tested against fakes, not live services</text></svg>