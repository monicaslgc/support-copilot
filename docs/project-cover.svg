  <text x="92" y="526" fill="#353832" font-family="monospace" font-size="14">SYNTHETIC DATA · OFFLINE TESTS · NOT YET VERIFIED AGAINST LIVE SERVICES</text>
  <text x="92" y="558" fill="#263C32" font-family="Georgia, 'Times New Roman', serif" font-size="20">Creative &amp; Analytical — Product · AI · Automation</text>
