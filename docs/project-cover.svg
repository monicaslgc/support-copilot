    <text x="851" y="436" fill="#A8B29A" font-size="14">Approve or reject</text>
    <path d="M966 417 H994 M986 409 L994 417 L986 425" fill="none" stroke="#263C32" stroke-width="2"/>
    <rect x="1004" y="378" width="184" height="78" rx="3" fill="#FFFFFF" stroke="#263C32" stroke-opacity=".25"/>
    <text x="1096" y="423" fill="#353832">Customer</text>
